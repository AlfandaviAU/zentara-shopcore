[package]
name = "shopcore"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "ShopCore order, wallet and reporting backend (Rust port of the legacy Flask service)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "shopcore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "derive"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 4
